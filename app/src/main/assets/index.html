<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>POKEHOME</title><link rel="stylesheet" href="f12-app-feel.css"><style>body{margin:0;font-family:system-ui;background:#f5f6f8;color:#15171a}.app{max-width:900px;margin:auto;padding:20px 16px 92px}.hero,.card{background:#fff;border-radius:24px;padding:20px;margin-bottom:14px;box-shadow:0 8px 30px #0000000d}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#f2f4f7;padding:16px;border-radius:18px}.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:#fffffff2;backdrop-filter:blur(18px)}button{border:0;border-radius:16px;padding:12px 18px;font-weight:700}.screen{display:none}.screen.active{display:block}.f12-box-card{display:inline-flex;flex-direction:column;margin:5px;background:#fff}.f12-empty{padding:24px;text-align:center;color:#6b7280}</style></head><body><main class="app"><section class="screen active" data-route="home"><div class="hero"><small>POKEHOME · Living Dex</small><h1>Minha coleção</h1><div class="stats"><div class="stat"><b data-f12-captured>0</b><br>capturados</div><div class="stat"><b data-f12-missing>1025</b><br>faltando</div></div></div></section><section class="screen" data-route="pokedex"><div class="card"><h1>Pokédex</h1><div data-f12-pokedex-grid></div></div></section><section class="screen" data-route="box"><div class="card"><h1>Box</h1><div data-f12-box-grid></div></div></section><section class="screen" data-route="detail"><div class="card" data-f12-detail></div></section></main><nav class="nav"><button data-nav="home">Início</button><button data-nav="pokedex">Pokédex</button><button data-nav="box">Box</button></nav><script src="f12-shell.js"></script><script src="f12-collection.js"></script><script src="f12-forms.js"></script><script src="f12-game-data.js"></script><script src="f12-pokedex.js"></script><script src="f12-detail.js"></script><script src="f12-box.js"></script><script src="f12-home.js"></script><script src="f12-app-feel.js"></script><script src="f12-beta-audit.js"></script><script>document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{const r=b.dataset.nav;document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('active',x.dataset.route===r));if(window.F12Shell&&F12Shell.navigate)F12Shell.navigate(r);if(r==='box'&&window.F12Box)F12Box.render();if(r==='home'&&window.F12Home)F12Home.render();});</script></body></html>
