name: Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Validate runtime files
        run: |
          test -f app/src/main/assets/index.html
          test -f app/src/main/assets/f12-collection.js
          test -f app/src/main/assets/f12-pokedex.js
          test -f app/src/main/assets/f12-detail.js
          test -f app/src/main/assets/f12-box.js
          test -f app/src/main/assets/f12-home.js
          test -f app/src/main/assets/f12-beta-audit.js
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: APK SHA256
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app/build/outputs/apk/debug/SHA256.txt
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: POKEHOME-F12.25-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/SHA256.txt
          if-no-files-found: error
